name: Trivy image scan
on: 
    workflow_dispatch:
jobs: 
    Trivy_scan:
        runs-on: ubuntu-latest
        steps: 
            - name: code-checkout
              uses: actions/checkout@v4



            - name: Build Docker Image
              run: |
               docker build -t harsh9308/blog-app:${{ github.sha }} ./frontend/Dockerfile



            - name: Run trivi scan
              uses: aquasecurity/trivy-action@master
              with:
                image-ref:  harsh9308/blog-app:${{ github.sha }}
                format: 'table'
                severity: "CRITICAL"
                exit-code: 1