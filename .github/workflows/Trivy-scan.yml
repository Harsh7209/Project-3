name: Trivy image scan
on: 
    workflow_dispatch:
jobs: 
    Trivy_scan:
        runs-on: ubuntu-latest
        steps: 
            - name: code-checkout
              uses: actions/checkout@v4

            


            - name: Build Frontend Image
              run: |
                docker build \
                -t frontend-app:${{ github.sha }} \
                -f ./frontend/Dockerfile \
                ./frontend


            - name: Run trivi scan
              uses: aquasecurity/trivy-action@master
              with:
                image-ref:  harsh9308/blog-app:${{ github.sha }}
                format: 'table'
                severity: "CRITICAL"
                exit-code: 1