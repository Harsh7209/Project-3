name: Code-Quality check

on: 
    push: 

jobs: 
    Code-Lint:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout-code
              uses: actions/checkout@v4

            - name: Setup-code
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
            
            - name: Install Dependencies
              run: npm ci

            - name: Run Eslint
              run: npx eslint . --ext .js,.jsx,.ts,.tsx

            