name: Ci Pipeline for Blogging application

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      -  'frontend/**'
      - 'kubernetes/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_REPO-1: harsh9308/blog-app-backend
  DOCKERHUB_REPO-2: harsh9308/blog-app-frontend

jobs:
  build-and-push:
    name: Compile validate and push to docker hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'  

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build


      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO-1 }}:latest
            ${{ env.DOCKERHUB_REPO-1 }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



      - name: Build and Push Docker migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO-2 }}:latest
            ${{ env.DOCKERHUB_REPO-2 }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes deployment manifest
        run: |
          sed -i "s|image: ${{ env.DOCKERHUB_REPO-1 }}:.*|image: ${{ env.DOCKERHUB_REPO-1 }}:${{ steps.tag.outputs.sha_short }}|" kubernetes/08-easyshop-deployment.yaml
     
      - name: Update Kubernetes migration job manifest
        run: |
          sed -i "s|image: ${{ env.DOCKERHUB_REPO-2 }}:.*|image: ${{ env.DOCKERHUB_REPO-2 }}:${{ steps.tag.outputs.sha_short }}|" kubernetes/12-migration-job.yaml


      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/08-easyshop-deployment.yaml
          git add kubernetes/12-migration-job.yaml
          git diff --staged --quiet || git commit -m "ci: update bankapp image to ${{ steps.tag.outputs.sha_short }} [skip ci]"
          git push